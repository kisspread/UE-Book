name: Deploy VitePress to Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Weekly Report, Monthly Report Sync, "Generate UE Plugin Docs", "Library Submission"]
    types: [completed]
  push:
    branches: [master]
    paths:
      - 'ue-book/docs/**'
      - 'ue-book/docs/public/**'
      - '.vitepress/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

# ── Act local test ──
#   act -W .github/workflows/deploy.yml --container-architecture linux/amd64
# Note: act runs as root; CI runs as non-root. pnpm install may need --no-frozen-lockfile in act.

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # 强行分配 10GB 的硬盘作为虚拟内存！(使用 dd 命令代替 fallocate)
      - name: Allocate Swap Space
        run: |
          sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=10240
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          echo "Swap memory created:"
          free -h

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync manifest
        run: node scripts/sync-manifest.mjs

      - name: Build VitePress in Batches
        run: pnpm docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: vitepress/dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
