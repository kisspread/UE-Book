name: Monthly Report Sync

on:
  workflow_dispatch:
  schedule:
    # Every Monday 00:00 UTC
    - cron: '0 0 * * 1'

# act test: act -W .github/workflows/monthly.yml --container-architecture linux/amd64

jobs:
  sync-monthly:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install langchain-openai langchain-core

      - name: Run monthly report
        id: report
        run: python3 ue-book/scripts/monthly_report.py

      - name: Sync manifest
        run: node scripts/sync-manifest.mjs

      - name: Commit changes
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ue-book/docs/updates/ ue-book/docs/public/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "docs: sync monthly report"
          git pull --rebase origin master
          git remote set-url origin "https://x-access-token:***@github.com/kisspread/UE-Book.git"
          git push

      - name: Notify Telegram
        if: success()
        run: |
          curl -s "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d text="📅 月报已同步
          🔗 https://kisspread.github.io/UE-Book/updates/" || true
