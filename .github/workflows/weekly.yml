name: Weekly Report

on:
  workflow_dispatch:
  schedule:
    # Daily 02:00 UTC
    - cron: '0 2 * * 1'

jobs:
  weekly:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install langchain-openai langchain-core

      - name: Run weekly report
        id: report
        run: |
          python3 ue-book/scripts/weekly_report.py --days 7 2>&1 | tee /tmp/report_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Sync manifest
        if: steps.report.outcome == 'success'
        run: node scripts/sync-manifest.mjs

      - name: Commit changes
        if: steps.report.outcome == 'success'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ue-book/docs/updates/ ue-book/docs/public/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "docs: weekly plugin report"
          git pull --rebase origin master
          git remote set-url origin "https://x-access-token:***@github.com/kisspread/UE-Book.git"
          git push

      - name: Notify Telegram
        if: always()
        run: |
          if [ -f /tmp/report_output.txt ]; then
            LAST_LINE=$(tail -1 /tmp/report_output.txt)
          else
            LAST_LINE=""
          fi
          if [ "${{ steps.report.outcome }}" = "success" ]; then
            curl -s "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT_ID}" \
              -d text="📰 周报已更新
          🔗 https://kisspread.github.io/UE-Book/updates/" || true
          else
            curl -s "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT_ID}" \
              -d text="❌ 周报生成失败
          ${LAST_LINE}" || true
          fi
