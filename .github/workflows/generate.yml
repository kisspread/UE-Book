name: Generate UE Plugin Docs

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'UE version (e.g. 5.8)'
        required: true
        type: string
      force:
        description: 'Force regenerate plugins (comma-separated, or "all")'
        required: false
        type: string
      max_duration:
        description: 'Max duration per run in seconds (default: 10000 ≈ 2h47m)'
        required: false
        type: string

concurrency:
  group: generate-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: ue-book

    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Notify start
        run: |
          curl -s "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d text="▶️ UE Doc Pipeline started
          Version: ${{ inputs.version }}
          Force: ${{ inputs.force || 'incremental' }}" || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install gh CLI
        run: |
          sudo mkdir -p -m 755 /etc/apt/keyrings
          wget -qO /tmp/gh-keyring.gpg https://cli.github.com/packages/githubcli-archive-keyring.gpg
          sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null < /tmp/gh-keyring.gpg
          sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq gh

      - name: Install dependencies
        run: pip install -r v2/requirements.txt

      - name: Run pipeline
        id: pipeline
        run: |
          ARGS="--version ${{ inputs.version }}"
          if [ "${{ inputs.force }}" = "all" ]; then
            ARGS="$ARGS --force-all"
          elif [ -n "${{ inputs.force }}" ]; then
            ARGS="$ARGS --force $(echo '${{ inputs.force }}' | tr ',' ' ')"
          fi
          if [ -n "${{ inputs.max_duration }}" ]; then
            ARGS="$ARGS --max-duration ${{ inputs.max_duration }}"
          fi
          python3 -m v2.run $ARGS 2>&1 | tee ../pipeline_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Commit and push (fallback)
        if: always()
        run: |
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # run.py handles commit+push under normal conditions.
          # This step is a safety net — picks up any files saved to disk
          # if run.py crashed before it could push.
          git add ue-book/docs/ ue-book/manifest.json ue-book/v2/last_run.json
          if git diff --cached --quiet; then
            echo "No uncommitted changes (run.py already pushed)."
            exit 0
          fi
          git commit -m "docs: fallback commit for UE ${{ inputs.version }} plugin docs"
          git pull --rebase origin master
          git push

      - name: Notify result
        if: always()
        run: |
          if [ -f v2/last_run.json ]; then
            SUMMARY=$(python3 -c "
          import json
          d = json.load(open('v2/last_run.json'))
          # Prefer this_round (per-round), fall back to results (merged) for backward compat
          this_round = d.get('this_round', d.get('results', []))
          success = sum(1 for r in this_round if r.get('success') and not r.get('skipped'))
          failed = sum(1 for r in this_round if not r.get('success') and not r.get('skipped'))
          skipped = sum(1 for r in this_round if r.get('skipped'))
          elapsed = d.get('last_result', {}).get('elapsed', 0)
          # Show last 5 generated (most recent), not first 5 (always the same)
          names = [r['name'] for r in this_round if r.get('success') and not r.get('skipped')][-5:]
          err_names = [r['name'] for r in this_round if not r.get('success') and not r.get('skipped')][:3]
          lines = []
          if success: lines.append(f'✅ {success} succeeded')
          if skipped: lines.append(f'⏭️  {skipped} skipped')
          if failed: lines.append(f'❌ {failed} failed')
          lines.append(f'⏱️ {elapsed:.0f}s')
          if names: lines.append(f'Generated: {\", \".join(names)}')
          if err_names: lines.append(f'Errors: {\", \".join(err_names)}')
          print('\\n'.join(lines))
          ")
          else
            SUMMARY="Pipeline output not found"
          fi

          STATUS="✅"
          if [ "${{ steps.pipeline.outputs.exit_code }}" != "0" ]; then
            STATUS="❌"
          fi

          curl -s "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d text="${STATUS} UE Doc Pipeline finished
          Version: ${{ inputs.version }}

          ${SUMMARY}" || true
