name: Library Submission

on:
  issues:
    types: [labeled]

# Per-issue concurrency: same issue won't run twice, different issues run in parallel
concurrency:
  group: library-submit-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  process-submission:
    if: ${{ github.event.action == 'labeled' && github.event.label.name == 'library-submission' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_URL: ${{ github.event.issue.html_url }}

    steps:
      - name: Print Labels for Debugging
        run: echo "Labels are ${{ toJSON(github.event.issue.labels) }}"
        
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install langchain-openai langchain-core

      - name: Process submission
        id: process
        run: python3 ue-book/scripts/library_submit.py

      - name: Commit and push
        if: steps.process.outputs.commit_msg != ''
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ue-book/docs/libraries/index.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "${{ steps.process.outputs.commit_msg }}"
          git remote set-url origin "https://x-access-token:${GH_PAT}@github.com/kisspread/UE-Book.git"
          # Retry up to 3 times with merge strategy for conflicts
          for i in 1 2 3; do
            if git pull --rebase origin master 2>/dev/null; then
              git push && break
            else
              echo "[retry $i] rebase failed, trying merge..."
              git rebase --abort 2>/dev/null
              git pull --no-rebase -X theirs origin master
              git push && break
            fi
            sleep 3
          done

      - name: Notify Telegram
        if: steps.process.outputs.commit_msg != ''
        run: |
          curl -s "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d text="📚 新收录: ${{ steps.process.outputs.library_name }}
          🔗 ${{ steps.process.outputs.library_url }}
          📂 ${{ steps.process.outputs.library_category }}
          📝 ${{ steps.process.outputs.library_headline }}" || true
