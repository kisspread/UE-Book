name: Weekly Report

on:
  workflow_dispatch:
  schedule:
    # Every Monday 02:00 UTC
    - cron: '0 2 * * 1'

jobs:
  weekly:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install langchain-openai langchain-core

      - name: Run weekly report
        run: python3 ue-book/scripts/weekly_report.py --days 7

      - name: Sync manifest
        run: node scripts/sync-manifest.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ue-book/docs/updates/ ue-book/docs/public/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "docs: weekly plugin report [skip ci]"
          git pull --rebase origin master
          git push
